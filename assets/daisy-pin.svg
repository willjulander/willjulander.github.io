  <text x="477" y="360" text-anchor="middle" font-size="12" fill="#52646f" letter-spacing="2">SIDE</text>
  <text x="30" y="42" font-size="12" fill="#35618e" letter-spacing="2">DWG-001 &#183; DAISY PIN</text>
  <text x="30" y="60" font-size="10" fill="#9fb0bc" letter-spacing="1">PLACEHOLDER DRAWING &#8212; REPLACE WITH PHOTO</text>
