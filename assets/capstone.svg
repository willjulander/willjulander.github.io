<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="IBM Plex Mono, Consolas, monospace">
  <rect width="600" height="400" fill="#fdfeff"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8fa5b5" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Section view: flanged coupling -->
  <g stroke="#52646f" stroke-width="1.5">
    <rect x="150" y="120" width="40" height="160" fill="url(#hatch)"/>
    <rect x="190" y="160" width="130" height="80" fill="url(#hatch)"/>
    <rect x="150" y="185" width="170" height="30" fill="#fdfeff"/>
  </g>
  <!-- End view: flange face -->
  <g stroke="#52646f" stroke-width="1.5" fill="none">
    <circle cx="450" cy="200" r="80"/>
    <circle cx="450" cy="200" r="26"/>
    <circle cx="450" cy="200" r="58" stroke-dasharray="5 4" stroke-width="1"/>
    <circle cx="450" cy="142" r="9"/>
    <circle cx="450" cy="258" r="9"/>
    <circle cx="392" cy="200" r="9"/>
    <circle cx="508" cy="200" r="9"/>
  </g>
  <!-- Centerlines -->
  <g stroke="#9fb0bc" stroke-width="1" stroke-dasharray="14 4 3 4">
    <line x1="120" y1="200" x2="350" y2="200"/>
    <line x1="450" y1="100" x2="450" y2="300"/>
    <line x1="350" y1="200" x2="550" y2="200"/>
  </g>
  <!-- Dimension -->
  <g stroke="#35618e" stroke-width="1.2" fill="#35618e">
    <line x1="150" y1="320" x2="320" y2="320" fill="none"/>
    <path d="M150 320 l8 -3 v6 z"/>
    <path d="M320 320 l-8 -3 v6 z"/>
    <line x1="150" y1="288" x2="150" y2="326" fill="none" stroke-width="0.8"/>
    <line x1="320" y1="288" x2="320" y2="326" fill="none" stroke-width="0.8"/>
  </g>
  <text x="235" y="312" text-anchor="middle" font-size="13" fill="#35618e">85.0</text>
  <text x="235" y="360" text-anchor="middle" font-size="12" fill="#52646f" letter-spacing="2">SECTION A-A</text>
  <text x="450" y="330" text-anchor="middle" font-size="12" fill="#52646f" letter-spacing="2">END VIEW</text>
  <text x="30" y="42" font-size="12" fill="#35618e" letter-spacing="2">DWG-005 &#183; COURSEWORK PART</text>
  <text x="30" y="60" font-size="10" fill="#9fb0bc" letter-spacing="1">PLACEHOLDER DRAWING &#8212; REPLACE WITH YOUR CAD WORK</text>
</svg>
