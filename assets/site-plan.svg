<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="IBM Plex Mono, Consolas, monospace">
  <rect width="600" height="400" fill="#fdfeff"/>
  <!-- Property boundary -->
  <path d="M90 90 L510 70 L530 300 L120 330 Z" fill="none" stroke="#52646f" stroke-width="1.5" stroke-dasharray="18 5 4 5"/>
  <g stroke="#52646f" stroke-width="1.5" fill="none">
    <!-- Building footprint -->
    <rect x="180" y="130" width="170" height="110"/>
    <line x1="180" y1="170" x2="350" y2="170" stroke-width="1"/>
    <!-- Entry walk -->
    <path d="M265 240 v40 h60" stroke-width="1"/>
  </g>
  <!-- Parking rows -->
  <g stroke="#52646f" stroke-width="1">
    <rect x="400" y="120" width="90" height="150" fill="none"/>
    <line x1="400" y1="150" x2="490" y2="150"/>
    <line x1="400" y1="180" x2="490" y2="180"/>
    <line x1="400" y1="210" x2="490" y2="210"/>
    <line x1="400" y1="240" x2="490" y2="240"/>
  </g>
  <!-- Trees -->
  <g stroke="#52646f" stroke-width="1" fill="none">
    <circle cx="150" cy="270" r="14"/>
    <circle cx="185" cy="290" r="11"/>
    <circle cx="450" cy="300" r="12"/>
  </g>
  <!-- North arrow -->
  <g transform="translate(520,120)">
    <circle r="20" fill="none" stroke="#35618e" stroke-width="1.2"/>
    <path d="M0 -14 L6 8 L0 3 L-6 8 Z" fill="#35618e"/>
    <text y="38" text-anchor="middle" font-size="12" fill="#35618e">N</text>
  </g>
  <!-- Setback dimension -->
  <g stroke="#35618e" stroke-width="1.2" fill="#35618e">
    <line x1="120" y1="130" x2="180" y2="130" fill="none"/>
    <path d="M120 130 l8 -3 v6 z"/>
    <path d="M180 130 l-8 -3 v6 z"/>
  </g>
  <text x="150" y="122" text-anchor="middle" font-size="12" fill="#35618e">25'</text>
  <text x="265" y="192" text-anchor="middle" font-size="12" fill="#52646f" letter-spacing="2">BUILDING</text>
  <text x="445" y="112" text-anchor="middle" font-size="11" fill="#52646f" letter-spacing="1">PARKING</text>
  <text x="30" y="42" font-size="12" fill="#35618e" letter-spacing="2">DWG-004 &#183; SITE LAYOUT</text>
  <text x="30" y="60" font-size="10" fill="#9fb0bc" letter-spacing="1">PLACEHOLDER DRAWING &#8212; REPLACE WITH ACE PROJECT GRAPHICS</text>
</svg>
