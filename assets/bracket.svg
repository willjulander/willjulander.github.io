    <path d="M300 320 l-8 -3 v6 z"/>
    <line x1="120" y1="288" x2="120" y2="326" fill="none" stroke-width="0.8"/>
    <line x1="300" y1="288" x2="300" y2="326" fill="none" stroke-width="0.8"/>
    <line x1="90" y1="110" x2="90" y2="280" fill="none"/>
    <path d="M90 110 l-3 8 h6 z"/>
    <path d="M90 280 l-3 -8 h6 z"/>
  </g>
  <text x="210" y="312" text-anchor="middle" font-size="13" fill="#35618e">180.0</text>
  <text x="60" y="198" font-size="13" fill="#35618e" transform="rotate(-90 60 198)" text-anchor="middle">170.0</text>
  <text x="160" y="360" text-anchor="middle" font-size="12" fill="#52646f" letter-spacing="2">FRONT VIEW</text>
